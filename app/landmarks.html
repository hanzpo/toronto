<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landmark Gallery</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb8cc; font-family: system-ui, sans-serif; }

      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, -100%); color: #fff; font-size: 12px; font-weight: 600;
             text-shadow: 0 1px 2px #000a; white-space: nowrap; }
      #hud { position: fixed; left: 8px; top: 8px; color: #fff; font: 12px ui-monospace, monospace; text-shadow: 0 1px 2px #000; }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <div id="labels"></div>
    <div id="hud"></div>
    <script type="module" src="/src/landmarks-gallery.ts"></script>
  </body>
