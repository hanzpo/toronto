[package]
name = "gta-sim"
version = "0.1.0"
edition = "2021"
description = "Agent-based local traffic + pedestrian simulation (Rust -> WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
flate2 = "1"
